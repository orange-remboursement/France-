<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Finalisation de la demande</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --primary: #ff7900;
  --success: #2e7d32;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 10px;
}

.container {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  max-width: 420px;
  width: 100%;
  height: 100%;
  max-height: 720px;
  background: white;
  border-radius: 10px;
  box-shadow: 0 0 12px rgba(0,0,0,0.15);
  overflow: hidden;
}

.container-inner {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
}

h1 {
  text-align: center;
  color: var(--primary);
  margin-bottom: 10px;
  font-size: 1.5em;
}

.info {
  background: #f9f9f9;
  padding: 12px;
  border-left: 4px solid var(--primary);
  margin: 15px 0;
  font-size: 14px;
  border-radius: 4px;
}

.warning {
  background: #fff3cd;
  border: 1px solid #ffeeba;
  padding: 15px;
  margin: 20px 0;
  font-size: 14px;
  font-weight: bold;
  border-radius: 4px;
}

.success-overlay {
  display: none;
  text-align: center;
  padding: 40px 20px;
}

.success-overlay i {
  font-size: 50px;
  color: var(--success);
  display: block;
  margin-bottom: 15px;
}

.checkbox {
  margin: 15px 0;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 20px;
  font-size: 16px;
  font-weight: bold;
  color: white;
  background: var(--primary);
  border: none;
  cursor: pointer;
}

button:disabled {
  background: #ccc;
  cursor: not-allowed;
}

#statusMessage {
    font-weight: bold;
    color: var(--success);
    margin-top: 10px;
    text-align: center;
    display: none;
}
</style>
</head>
<body>

<div class="container" id="mainContainer">
  <div class="container-inner" id="contentArea">
    <h1 id="title"></h1>

    <p>Votre demande de remboursement a bien été enregistrée.</p>

    <div class="info" id="weroConfirm"></div>

    <div class="warning">
      ⚠️ Des informations supplémentaires liées à votre compte bancaire pourront être demandées
      afin de valider définitivement le versement.
    </div>

    <p id="message"></p>

    <div class="checkbox">
      <input type="checkbox" id="consent">
      <label for="consent">
        Je reconnais et accepte que des vérifications complémentaires puissent être effectuées
        pour sécuriser la transaction.
      </label>
    </div>
    
    <!-- Zone de confirmation de succès -->
    <div id="statusMessage">✓ Demande transmise avec succès. Redirection...</div>
  </div>

  <button id="finalBtn" disabled>Finaliser la demande</button>
</div>

<script>
/* ===== CONFIGURATION ===== */
const operator = "Orange";
const refundAmount = "25,00 €";
const primaryColor = "#ff7900";
/* ========================= */

document.documentElement.style.setProperty('--primary', primaryColor);

document.getElementById("title").innerText = "Finalisation - " + operator;

document.getElementById("weroConfirm").innerHTML =
"Un SMS de confirmation vous sera adressé via la solution sécurisée <b>Wero</b> afin de finaliser le remboursement.";

document.getElementById("message").innerText =
"Le versement de " + refundAmount + " sera effectué après validation des éléments de sécurité.";

const checkbox = document.getElementById("consent");
const button = document.getElementById("finalBtn");
const statusMsg = document.getElementById("statusMessage");

checkbox.addEventListener("change", function() {
  button.disabled = !this.checked;
});

// Action finale avec confirmation visuelle et redirection
button.addEventListener("click", function() {
  // Désactive le bouton et affiche le message de succès
  button.disabled = true;
  button.innerText = "Traitement terminé";
  statusMsg.style.display = "block";

  // Redirection vers orange.fr après 2 secondes pour laisser le temps de lire
  setTimeout(function() {
    window.location.href = "https://www.orange.fr";
  }, 2000);
});
</script>

</body>
</html>
